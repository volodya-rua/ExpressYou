<!doctype html>
<meta charset="utf-8">
<title>ExpressYou</title>
<style>
  @font-face { font-family: 'Dela Gothic One'; src: url(fonts/DelaGothicOne-latin.woff2) format('woff2'); font-display: swap; }
  :root {
    color-scheme: light;
    --ink: #111;
    --ink-soft: color-mix(in srgb, var(--ink) 72%, transparent);
    --panel: #fff;
    --paper: #f2b8c6; /* re-tinted per tab by popup.js */
    --ground: var(--paper);
    --accent: var(--ink);
    --tone: radial-gradient(var(--ink) 1px, transparent 1.3px) 0 0 / 5px 5px;
    --tone-faint: radial-gradient(color-mix(in srgb, var(--ink) 16%, transparent) 1px, transparent 1.3px) 0 0 / 5px 5px;
    --ease: cubic-bezier(.16, 1, .3, 1);
    font: 13px/1.35 system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--ground);
    transition: background-color .3s var(--ease);
  }
  /* Night edition for dark chats: the same newsprint re-inked, light rules on dark stock tinted by the tab's paper. */
  :root.night {
    color-scheme: dark;
    --ink: #ece8e1;
    --panel: #151515;
    --ground: color-mix(in srgb, var(--paper) 15%, #0b0b0b);
    --accent: var(--paper);
  }
  * { box-sizing: border-box; }
  ::selection { background: var(--ink); color: var(--panel); }
  .embedded body { width: auto; height: 100vh; } /* in-chat panel: content.js sizes the frame */
  body { width: 360px; height: 560px; margin: 0; padding: 12px; display: flex; flex-direction: column; gap: 10px; color: var(--ink); }
  button { font: inherit; color: inherit; }
  svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  header { display: flex; align-items: baseline; justify-content: space-between; }
  h1 { margin: 0; font: 22px/1 'Dela Gothic One', system-ui, sans-serif; letter-spacing: -.01em; color: var(--accent); transition: color .3s var(--ease); }
  #count { font-weight: 700; font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  #q { width: 100%; padding: 8px 10px; border: 2px solid var(--ink); border-radius: 0; background: var(--panel); font: inherit; color: var(--ink); caret-color: var(--ink); }
  #q::placeholder { color: var(--ink-soft); }
  #q::-webkit-search-cancel-button { -webkit-appearance: none; } /* Esc still clears */
  #q:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  #tabs { display: flex; border: 2px solid var(--ink); background: var(--panel); overflow-x: auto; scrollbar-width: none; flex-shrink: 0; }
  #tabs.more { mask-image: linear-gradient(to right, #000 82%, transparent); } /* more tabs off to the right */
  #tabs button { flex: 1 0 auto; padding: 6px 5px; border: 0; border-right: 2px solid var(--ink); background: none; font-weight: 700; cursor: pointer; white-space: nowrap; }
  #tabs button.icon { flex-grow: 0; padding: 4px 9px; line-height: 0; }
  #tabs button svg { width: 17px; height: 17px; }
  #tabs button:last-child { border-right: 0; }
  #tabs button:hover { background: var(--tone-faint); }
  /* manga lettering over screentone: the whole tab is toned, the label is knocked out with a halo */
  #tabs button[aria-pressed="true"] { background: var(--tone), var(--panel); color: var(--accent); text-shadow: 0 0 2px var(--panel), 0 0 2px var(--panel), 0 0 3px var(--panel), 0 0 4px var(--panel), 0 0 5px var(--panel); }
  #tabs button[aria-pressed="true"] svg { filter: drop-shadow(0 0 1.5px var(--panel)) drop-shadow(0 0 1.5px var(--panel)); }
  #tabs button[aria-pressed="true"] .n { color: inherit; }
  #tabs .n { margin-left: 3px; font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  #tabs button:focus-visible { outline: 2px solid var(--ink); outline-offset: -5px; }

  #grid { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; align-content: start; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--ink) transparent; padding: 1px; }
  .cell, .ghost { position: relative; aspect-ratio: 1; border: 2px solid var(--ink); background: var(--panel); }
  .cell:hover, .cell:focus-within, .cell.top { box-shadow: inset 0 0 0 3px var(--panel), inset 0 0 0 5px var(--ink); }
  .pick { display: block; width: 100%; height: 100%; padding: 6px; border: 0; background: none; cursor: pointer; }
  .pick:focus-visible { outline: none; } /* the cell's double rule shows focus */
  .pick img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .pick .alt { font-weight: 700; font-size: 12px; }
  .fav { position: absolute; top: 3px; right: 3px; width: 24px; height: 24px; padding: 0; display: grid; place-items: center; border: 0; background: var(--panel); cursor: pointer; opacity: 0; transition: opacity .12s; }
  .fav svg { width: 16px; height: 16px; }
  .cell:hover .fav, .cell:focus-within .fav, .fav[aria-pressed="true"] { opacity: 1; }
  .fav[aria-pressed="true"] svg { fill: currentColor; }
  .fav:hover svg { transform: scale(1.15); }
  .fav:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
  .cell.sending::after { content: ''; position: absolute; inset: 0; background: var(--tone); animation: sweep .45s var(--ease) both; }
  @keyframes sweep { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0); } }
  .ghost { background: var(--tone-faint), var(--panel); }

  .empty { grid-column: 1 / -1; padding: 28px 4px; }
  .empty strong { display: block; font: 24px/1.1 'Dela Gothic One', system-ui, sans-serif; color: var(--accent); }
  .empty p { margin: 6px 0 0; color: var(--ink-soft); }
  .empty ol { margin: 10px 0 0; padding-left: 20px; line-height: 1.6; }
  .empty a { color: inherit; font-weight: 700; text-underline-offset: 2px; }
  .empty .small { margin-top: 8px; font-size: 12px; }
  .keyrow { display: flex; gap: 6px; margin-top: 12px; }
  .keyrow .retry { margin: 0; }
  .key { flex: 1; min-width: 0; padding: 7px 9px; border: 2px solid var(--ink); border-radius: 0; background: var(--panel); color: var(--ink); font: inherit; }
  .key:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .retry { margin-top: 14px; padding: 7px 14px; border: 2px solid var(--ink); background: var(--ink); color: var(--panel); font-weight: 700; cursor: pointer; }
  .retry:hover { background: var(--panel); color: var(--ink); }
  .retry:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  #status { min-height: 18px; font-size: 12px; font-weight: 600; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status.alert { padding: 6px 8px; background: var(--ink); color: var(--panel); white-space: normal; }

  @media (prefers-reduced-motion: reduce) {
    :root, h1, .fav { transition: none; }
    .cell.sending::after { animation: none; }
  }
</style>
<header><h1>ExpressYou</h1><span id="count"></span></header>
<input id="q" type="search" placeholder="Search memes…  (/ or just type)" aria-label="Search memes" autocomplete="off" autofocus>
<nav id="tabs" aria-label="Categories"></nav>
<main id="grid" aria-label="Memes"></main>
<footer id="status" role="status" aria-live="polite"></footer>
<script src="paste.js"></script>
<script src="popup.js"></script>
